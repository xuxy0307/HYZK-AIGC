<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详情页图片生成 - 华阳智瞰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.2);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .back-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .credit-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            font-weight: 600;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
        }

        .upload-placeholder .icon {
            font-size: 48px;
            opacity: 0.6;
        }

        .upload-preview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .scene-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .scene-option {
            padding: 16px;
            background: rgba(15, 23, 42, 0.4);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .scene-option:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .scene-option.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.2);
        }

        .scene-option .emoji {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .scene-option .name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .scene-option .desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .generate-count {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .count-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .count-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        .count-value {
            font-size: 20px;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .result-placeholder {
            flex: 1;
            min-height: 500px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 2px dashed var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .result-placeholder .icon {
            font-size: 80px;
            opacity: 0.4;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .result-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .result-item-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.2);
        }

        .result-item-actions {
            padding: 12px;
            display: flex;
            gap: 8px;
        }

        .result-item-btn {
            flex: 1;
            padding: 8px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .result-item-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
        }

        .toast-container {
            position: fixed;
            top: 100px;
            right: 30px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 24px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">
                <span>←</span>
                <span>返回工作台</span>
            </button>
            <h1 class="header-title">📄 详情页图片生成</h1>
        </div>
        <div class="header-right">
            <div class="credit-display">
                <span>💎</span>
                <span id="creditAmount">2,580</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <section class="input-section">
            <div class="section-card">
                <div class="section-title">
                    <div class="icon">📷</div>
                    <span>产品图片</span>
                </div>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('productImage').click()">
                    <input type="file" id="productImage" accept="image/*" onchange="handleImageUpload(event)">
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <span class="icon">📤</span>
                        <p>点击或拖拽上传产品图片</p>
                        <p style="font-size: 13px; opacity: 0.7;">支持 JPG、PNG 格式</p>
                    </div>
                    <img class="upload-preview" id="uploadPreview" style="display: none;">
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <div class="icon">📝</div>
                    <span>产品信息</span>
                </div>
                <div class="form-group">
                    <label class="form-label">产品名称</label>
                    <input type="text" class="form-input" id="productName" placeholder="例如：智能手表">
                </div>
                <div class="form-group">
                    <label class="form-label">产品卖点（用逗号分隔）</label>
                    <textarea class="form-textarea" id="productFeatures" placeholder="例如：防水, 心率监测, 长续航, 高清屏幕"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">产品规格</label>
                    <input type="text" class="form-input" id="productSpecs" placeholder="例如：尺寸、颜色、材质等">
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <div class="icon">🎨</div>
                    <span>选择场景类型</span>
                </div>
                <div class="scene-grid">
                    <div class="scene-option selected" data-scene="white" onclick="selectScene(this)">
                        <div class="emoji">⬜</div>
                        <div class="name">白底图</div>
                        <div class="desc">专业产品展示</div>
                    </div>
                    <div class="scene-option" data-scene="lifestyle" onclick="selectScene(this)">
                        <div class="emoji">🏠</div>
                        <div class="name">生活场景</div>
                        <div class="desc">真实使用环境</div>
                    </div>
                    <div class="scene-option" data-scene="detail" onclick="selectScene(this)">
                        <div class="emoji">🔍</div>
                        <div class="name">细节特写</div>
                        <div class="desc">突出产品细节</div>
                    </div>
                    <div class="scene-option" data-scene="compare" onclick="selectScene(this)">
                        <div class="emoji">⚖️</div>
                        <div class="name">对比图</div>
                        <div class="desc">尺寸/功能对比</div>
                    </div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <div class="icon">🔢</div>
                    <span>生成数量</span>
                </div>
                <div class="generate-count">
                    <button class="count-btn" onclick="changeCount(-1)">−</button>
                    <span class="count-value" id="generateCount">4</span>
                    <button class="count-btn" onclick="changeCount(1)">+</button>
                    <span style="color: var(--text-secondary); margin-left: 10px;">张（每张消耗 3 积分）</span>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn" onclick="generateDetailImages()">
                <span>⚡</span>
                <span>生成详情页图片</span>
            </button>
        </section>

        <section class="result-section">
            <div class="result-placeholder" id="resultPlaceholder">
                <span class="icon">📄</span>
                <h3>准备生成详情页图片</h3>
                <p>上传产品图片并选择场景类型后，AI将为您生成一套完整的电商详情页图片</p>
            </div>

            <div class="result-grid" id="resultGrid" style="display: none;"></div>
        </section>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // 配置
        const CONFIG = {
            COST_PER_IMAGE: 3,
            MAX_COUNT: 8,
            MIN_COUNT: 1
        };

        // 场景模板
        const SCENE_TEMPLATES = {
            white: {
                name: '白底图',
                prompts: [
                    'Professional product photography on pure white background, clean and minimal, studio lighting, high-end e-commerce style',
                    'Product showcase on white background, soft shadows, professional studio shot, crisp details, commercial photography',
                    'Clean white background product photo, even lighting, no distractions, premium quality, sharp focus',
                    'Minimalist product photography, pure white backdrop, professional lighting, e-commerce ready'
                ]
            },
            lifestyle: {
                name: '生活场景',
                prompts: [
                    'Product in modern home setting, natural lighting, lifestyle photography, cozy atmosphere, real usage scenario',
                    'Product placed in elegant interior, warm ambient light, lifestyle context, aspirational setting',
                    'Product being used in daily life scene, authentic environment, natural composition, relatable moment',
                    'Lifestyle product photography, home environment, soft natural light, comfortable setting'
                ]
            },
            detail: {
                name: '细节特写',
                prompts: [
                    'Macro product detail shot, extreme close-up, texture visible, craftsmanship highlight, premium materials',
                    'Product detail photography, specific feature focus, intricate details, high magnification',
                    'Close-up of product key feature, sharp detail, material texture, quality craftsmanship',
                    'Detailed product shot highlighting unique features, macro photography, crisp details'
                ]
            },
            compare: {
                name: '对比图',
                prompts: [
                    'Product size comparison with everyday objects, scale reference, informative display, clear proportions',
                    'Before and after comparison, product benefits visualization, split composition, effective demonstration',
                    'Product vs competitor comparison, feature highlights, informative layout, clear advantages',
                    'Size scale reference photo, product next to common items, helpful comparison, practical visualization'
                ]
            }
        };

        let state = {
            uploadedImage: null,
            selectedScene: 'white',
            generateCount: 4,
            isGenerating: false
        };

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                state.uploadedImage = e.target.result;
                document.getElementById('uploadPreview').src = e.target.result;
                document.getElementById('uploadPreview').style.display = 'block';
                document.getElementById('uploadPlaceholder').style.display = 'none';
                showToast('图片上传成功', 'success');
            };
            reader.readAsDataURL(file);
        }

        function selectScene(element) {
            document.querySelectorAll('.scene-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            state.selectedScene = element.dataset.scene;
        }

        function changeCount(delta) {
            const newCount = state.generateCount + delta;
            if (newCount >= CONFIG.MIN_COUNT && newCount <= CONFIG.MAX_COUNT) {
                state.generateCount = newCount;
                document.getElementById('generateCount').textContent = newCount;
            }
        }

        async function generateDetailImages() {
            if (!state.uploadedImage) {
                showToast('请先上传产品图片', 'error');
                return;
            }

            const totalCost = state.generateCount * CONFIG.COST_PER_IMAGE;
            const currentCredits = parseInt(document.getElementById('creditAmount').textContent.replace(/,/g, ''));
            
            if (currentCredits < totalCost) {
                showToast('积分不足，请充值后再试', 'error');
                return;
            }

            state.isGenerating = true;
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('generateBtn').textContent = '生成中...';

            // 模拟生成
            const template = SCENE_TEMPLATES[state.selectedScene];
            const results = [];

            for (let i = 0; i < state.generateCount; i++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                results.push({
                    url: `https://via.placeholder.com/600x800/6366f1/ffffff?text=Detail+${i+1}`,
                    prompt: template.prompts[i % template.prompts.length]
                });
                showToast(`已生成 ${i + 1}/${state.generateCount} 张`, 'success');
            }

            displayResults(results);
            
            // 扣除积分
            const creditEl = document.getElementById('creditAmount');
            creditEl.textContent = (currentCredits - totalCost).toLocaleString();

            state.isGenerating = false;
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').innerHTML = '<span>⚡</span><span>生成详情页图片</span>';
        }

        function displayResults(results) {
            document.getElementById('resultPlaceholder').style.display = 'none';
            const grid = document.getElementById('resultGrid');
            grid.style.display = 'grid';
            grid.innerHTML = results.map((result, index) => `
                <div class="result-item">
                    <img class="result-item-image" src="${result.url}" alt="详情图${index + 1}">
                    <div class="result-item-actions">
                        <button class="result-item-btn" onclick="downloadImage('${result.url}')">下载</button>
                        <button class="result-item-btn" onclick="copyPrompt('${result.prompt}')">复制提示词</button>
                    </div>
                </div>
            `).join('');
        }

        function downloadImage(url) {
            const link = document.createElement('a');
            link.href = url;
            link.download = `detail-image-${Date.now()}.png`;
            link.click();
            showToast('图片下载已开始', 'success');
        }

        function copyPrompt(prompt) {
            navigator.clipboard.writeText(prompt).then(() => {
                showToast('提示词已复制', 'success');
            });
        }

        function goBack() {
            window.location.href = 'ai-workbench-20260415_162800.html';
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
