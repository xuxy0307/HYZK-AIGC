<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键去水印 - 华阳智瞰</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00bcd4; --primary-dark: #0097a7; --secondary: #4dd0e1;
            --bg-dark: #0f172a; --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.2); --success: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg-dark); min-height: 100vh; color: var(--text-primary);
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 20% 50%, rgba(0, 188, 212, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(77, 208, 225, 0.1) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
        }
        @keyframes bgPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .header {
            background: var(--bg-card); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .back-btn {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: rgba(0, 188, 212, 0.1); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text-primary); cursor: pointer;
        }
        .back-btn:hover { background: rgba(0, 188, 212, 0.2); border-color: var(--primary); }
        .header-title {
            font-size: 24px; font-weight: bold;
            background: linear-gradient(135deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .credit-display {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.2), rgba(77, 208, 225, 0.2));
            border: 1px solid rgba(0, 188, 212, 0.3); border-radius: 12px; font-weight: 600;
        }
        .main-container {
            max-width: 1200px; margin: 0 auto; padding: 40px;
        }
        .upload-section {
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 60px; text-align: center; margin-bottom: 40px;
        }
        .upload-area {
            border: 3px dashed var(--border); border-radius: 20px;
            padding: 80px 40px; cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(0, 188, 212, 0.05); }
        .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 80px; margin-bottom: 24px; opacity: 0.6; }
        .upload-title { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        .upload-desc { color: var(--text-secondary); font-size: 16px; margin-bottom: 24px; }
        .upload-formats {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
        }
        .format-tag {
            padding: 8px 16px; background: rgba(0, 188, 212, 0.1);
            border: 1px solid var(--border); border-radius: 20px;
            font-size: 13px; color: var(--text-secondary);
        }
        .platform-section {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
            margin-bottom: 40px;
        }
        .platform-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; text-align: center;
            cursor: pointer; transition: all 0.3s;
        }
        .platform-card:hover { border-color: var(--primary); transform: translateY(-4px); }
        .platform-card .icon { font-size: 40px; margin-bottom: 12px; }
        .platform-card .name { font-weight: 600; margin-bottom: 4px; }
        .platform-card .desc { font-size: 12px; color: var(--text-secondary); }
        .features-section {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
            margin-bottom: 40px;
        }
        .feature-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 28px;
        }
        .feature-card .icon {
            width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 16px;
        }
        .feature-card .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .feature-card .desc { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
        .result-section {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px; display: none;
        }
        .result-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .result-title { font-size: 20px; font-weight: 600; }
        .compare-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
        }
        .compare-item {
            background: rgba(0, 0, 0, 0.3); border-radius: 16px; overflow: hidden;
        }
        .compare-label {
            padding: 16px; background: rgba(0, 0, 0, 0.3);
            font-weight: 600; text-align: center;
        }
        .compare-content {
            padding: 24px; display: flex; justify-content: center; align-items: center;
            min-height: 300px;
        }
        .compare-content img, .compare-content video {
            max-width: 100%; max-height: 400px; border-radius: 8px;
        }
        .download-btn {
            width: 100%; padding: 18px; margin-top: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 14px;
            font-size: 18px; font-weight: 600; cursor: pointer;
            transition: all 0.3s;
        }
        .download-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 188, 212, 0.4); }
        .toast-container {
            position: fixed; top: 100px; right: 30px; z-index: 10000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            padding: 14px 24px; background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @media (max-width: 1024px) {
            .main-container { padding: 20px; }
            .platform-section { grid-template-columns: repeat(3, 1fr); }
            .features-section { grid-template-columns: 1fr; }
            .compare-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">
                <span>←</span><span>返回工作台</span>
            </button>
            <h1 class="header-title">💧 一键去水印</h1>
        </div>
        <div class="header-right">
            <div class="credit-display">
                <span>💎</span><span id="creditAmount">2,580</span>
            </div>
        </div>
    </header>
    <main class="main-container">
        <div class="upload-section">
            <div class="upload-area" onclick="document.getElementById('mediaFile').click()">
                <input type="file" id="mediaFile" accept="image/*,video/*" onchange="handleUpload(event)">
                <div class="upload-icon">💧</div>
                <div class="upload-title">点击或拖拽上传文件</div>
                <div class="upload-desc">支持图片和视频去水印，自动识别并去除平台水印</div>
                <div class="upload-formats">
                    <span class="format-tag">JPG</span>
                    <span class="format-tag">PNG</span>
                    <span class="format-tag">MP4</span>
                    <span class="format-tag">MOV</span>
                </div>
            </div>
        </div>
        <div class="platform-section">
            <div class="platform-card" onclick="pasteUrl('douyin')">
                <div class="icon">🎵</div>
                <div class="name">抖音</div>
                <div class="desc">解析去水印</div>
            </div>
            <div class="platform-card" onclick="pasteUrl('kuaishou')">
                <div class="icon">⚡</div>
                <div class="name">快手</div>
                <div class="desc">解析去水印</div>
            </div>
            <div class="platform-card" onclick="pasteUrl('xiaohongshu')">
                <div class="icon">📕</div>
                <div class="name">小红书</div>
                <div class="desc">解析去水印</div>
            </div>
            <div class="platform-card" onclick="pasteUrl('bilibili')">
                <div class="icon">📺</div>
                <div class="name">B站</div>
                <div class="desc">解析去水印</div>
            </div>
            <div class="platform-card" onclick="pasteUrl('weibo')">
                <div class="icon">🌐</div>
                <div class="name">微博</div>
                <div class="desc">解析去水印</div>
            </div>
        </div>
        <div class="features-section">
            <div class="feature-card">
                <div class="icon">🤖</div>
                <div class="title">AI智能识别</div>
                <div class="desc">自动识别图片/视频中的水印位置，精准定位无需手动框选</div>
            </div>
            <div class="feature-card">
                <div class="icon">✨</div>
                <div class="title">无痕修复</div>
                <div class="desc">采用先进的图像修复算法，去除水印后画面自然无痕迹</div>
            </div>
            <div class="feature-card">
                <div class="icon">⚡</div>
                <div class="title">批量处理</div>
                <div class="desc">支持批量上传和批量去水印，大幅提升工作效率</div>
            </div>
        </div>
        <div class="result-section" id="resultSection">
            <div class="result-header">
                <span class="result-title">✨ 去水印结果</span>
                <span style="color: var(--success);">处理完成</span>
            </div>
            <div class="compare-container">
                <div class="compare-item">
                    <div class="compare-label">原图/原视频（带水印）</div>
                    <div class="compare-content" id="originalContent">
                        <p style="color: var(--text-secondary);">原文件预览</p>
                    </div>
                </div>
                <div class="compare-item">
                    <div class="compare-label">处理后（无水印）</div>
                    <div class="compare-content" id="processedContent">
                        <p style="color: var(--text-secondary);">处理后预览</p>
                    </div>
                </div>
            </div>
            <button class="download-btn" onclick="downloadResult()">⬇️ 下载无水印文件</button>
        </div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script>
        const CONFIG = { COST: 3, MODEL: 'banana2' };
        let state = { file: null, platform: null };
        function handleUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            state.file = file;
            processFile();
        }
        function pasteUrl(platform) {
            navigator.clipboard.readText().then(url => {
                if (url.includes('http')) {
                    state.platform = platform;
                    showToast(`正在解析${platform}链接...`, 'success');
                    processUrl(url);
                } else {
                    showToast('剪贴板中没有有效的链接', 'error');
                }
            }).catch(() => showToast('无法读取剪贴板', 'error'));
        }
        async function processFile() {
            const credits = parseInt(document.getElementById('creditAmount').textContent.replace(/,/g, ''));
            if (credits < CONFIG.COST) {
                showToast('积分不足', 'error');
                return;
            }
            await new Promise(r => setTimeout(r, 2000));
            document.getElementById('creditAmount').textContent = (credits - CONFIG.COST).toLocaleString();
            document.getElementById('resultSection').style.display = 'block';
            showToast('💧 去水印功能开发中，API对接后可正常使用', 'warning');
        }
        async function processUrl(url) {
            const credits = parseInt(document.getElementById('creditAmount').textContent.replace(/,/g, ''));
            if (credits < CONFIG.COST) {
                showToast('积分不足', 'error');
                return;
            }
            await new Promise(r => setTimeout(r, 3000));
            document.getElementById('creditAmount').textContent = (credits - CONFIG.COST).toLocaleString();
            document.getElementById('resultSection').style.display = 'block';
            showToast('💧 去水印功能开发中，API对接后可正常使用', 'warning');
        }
        function downloadResult() { showToast('下载功能开发中', 'warning'); }
        function goBack() { window.location.href = 'ai-workbench-20260415_162800.html'; }
        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${msg}</span>`;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }
    </script>
</body>
</html>
