<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情感类视频一键生产 - 华阳智瞰</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e91e63; --primary-dark: #c2185b; --secondary: #f48fb1;
            --bg-dark: #0f172a; --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.2); --success: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg-dark); min-height: 100vh; color: var(--text-primary);
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 20% 50%, rgba(233, 30, 99, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(244, 143, 177, 0.1) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
        }
        @keyframes bgPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .header {
            background: var(--bg-card); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .back-btn {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: rgba(233, 30, 99, 0.1); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text-primary); cursor: pointer;
        }
        .back-btn:hover { background: rgba(233, 30, 99, 0.2); border-color: var(--primary); }
        .header-title {
            font-size: 24px; font-weight: bold;
            background: linear-gradient(135deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .credit-display {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.2), rgba(244, 143, 177, 0.2));
            border: 1px solid rgba(233, 30, 99, 0.3); border-radius: 12px; font-weight: 600;
        }
        .main-container {
            max-width: 1400px; margin: 0 auto; padding: 40px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        }
        .input-section { display: flex; flex-direction: column; gap: 24px; }
        .section-card {
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px; padding: 28px;
        }
        .section-title {
            font-size: 18px; font-weight: 600; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title .icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
        }
        .emotion-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .emotion-option {
            padding: 20px 12px; background: rgba(15, 23, 42, 0.4);
            border: 2px solid var(--border); border-radius: 14px;
            cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .emotion-option:hover { border-color: var(--primary); transform: translateY(-2px); }
        .emotion-option.selected { border-color: var(--primary); background: rgba(233, 30, 99, 0.2); }
        .emotion-option .emoji { font-size: 36px; margin-bottom: 10px; }
        .emotion-option .name { font-weight: 600; margin-bottom: 4px; }
        .emotion-option .desc { font-size: 12px; color: var(--text-secondary); }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; }
        .form-textarea {
            width: 100%; padding: 14px 18px; background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 15px; min-height: 120px; resize: vertical;
        }
        .form-textarea:focus { outline: none; border-color: var(--primary); }
        .form-input {
            width: 100%; padding: 14px 18px; background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 15px;
        }
        .char-count { text-align: right; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        .music-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .music-option {
            padding: 14px; background: rgba(15, 23, 42, 0.4);
            border: 2px solid var(--border); border-radius: 12px;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px;
        }
        .music-option:hover { border-color: var(--primary); }
        .music-option.selected { border-color: var(--primary); background: rgba(233, 30, 99, 0.2); }
        .music-option .icon { font-size: 24px; }
        .music-option .info { flex: 1; }
        .music-option .name { font-weight: 600; }
        .music-option .desc { font-size: 12px; color: var(--text-secondary); }
        .generate-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 14px;
            font-size: 18px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .generate-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233, 30, 99, 0.4); }
        .result-section { display: flex; flex-direction: column; gap: 24px; }
        .result-placeholder {
            flex: 1; min-height: 500px; background: var(--bg-card);
            border: 2px dashed var(--border); border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; color: var(--text-secondary); text-align: center; padding: 40px;
        }
        .result-placeholder .icon { font-size: 80px; opacity: 0.4; }
        .video-preview-container {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; overflow: hidden;
        }
        .video-preview-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .video-preview-content {
            padding: 24px; background: rgba(0, 0, 0, 0.3);
            display: flex; justify-content: center;
        }
        .video-player {
            width: 100%; max-width: 400px; border-radius: 12px; background: #000;
        }
        .toast-container {
            position: fixed; top: 100px; right: 30px; z-index: 10000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            padding: 14px 24px; background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; padding: 20px; }
            .emotion-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">
                <span>←</span><span>返回工作台</span>
            </button>
            <h1 class="header-title">💕 情感类视频一键生产</h1>
        </div>
        <div class="header-right">
            <div class="credit-display">
                <span>💎</span><span id="creditAmount">2,580</span>
            </div>
        </div>
    </header>
    <main class="main-container">
        <section class="input-section">
            <div class="section-card">
                <div class="section-title">
                    <div class="icon">💝</div><span>选择情感主题</span>
                </div>
                <div class="emotion-grid">
                    <div class="emotion-option selected" data-emotion="love" onclick="selectEmotion(this)">
                        <div class="emoji">💕</div><div class="name">爱情</div><div class="desc">甜蜜浪漫</div>
                    </div>
                    <div class="emotion-option" data-emotion="friendship" onclick="selectEmotion(this)">
                        <div class="emoji">👭</div><div class="name">友情</div><div class="desc">真挚陪伴</div>
                    </div>
                    <div class="emotion-option" data-emotion="family" onclick="selectEmotion(this)">
                        <div class="emoji">👨‍👩‍👧</div><div class="name">亲情</div><div class="desc">温暖治愈</div>
                    </div>
                    <div class="emotion-option" data-emotion="nostalgia" onclick="selectEmotion(this)">
                        <div class="emoji">🌅</div><div class="name">怀旧</div><div class="desc">青春回忆</div>
                    </div>
                    <div class="emotion-option" data-emotion="inspirational" onclick="selectEmotion(this)">
                        <div class="emoji">💪</div><div class="name">励志</div><div class="desc">正能量</div>
                    </div>
                    <div class="emotion-option" data-emotion="healing" onclick="selectEmotion(this)">
                        <div class="emoji">🌸</div><div class="name">治愈</div><div class="desc">心灵抚慰</div>
                    </div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-title">
                    <div class="icon">📝</div><span>故事内容</span>
                </div>
                <div class="form-group">
                    <label class="form-label">故事梗概（可选，AI可自动生成）</label>
                    <textarea class="form-textarea" id="storyOutline" placeholder="简要描述你想表达的故事，或留空让AI生成..." maxlength="300"></textarea>
                    <div class="char-count"><span id="charCount">0</span>/300</div>
                </div>
                <div class="form-group">
                    <label class="form-label">关键台词/金句（可选）</label>
                    <input type="text" class="form-input" id="keyQuote" placeholder="输入一句你想表达的核心话语">
                </div>
            </div>
            <div class="section-card">
                <div class="section-title">
                    <div class="icon">🎵</div><span>背景音乐风格</span>
                </div>
                <div class="music-grid">
                    <div class="music-option selected" data-music="piano" onclick="selectMusic(this)">
                        <span class="icon">🎹</span>
                        <div class="info"><div class="name">钢琴曲</div><div class="desc">优雅深情</div></div>
                    </div>
                    <div class="music-option" data-music="guitar" onclick="selectMusic(this)">
                        <span class="icon">🎸</span>
                        <div class="info"><div class="name">吉他民谣</div><div class="desc">温暖治愈</div></div>
                    </div>
                    <div class="music-option" data-music="orchestral" onclick="selectMusic(this)">
                        <span class="icon">🎻</span>
                        <div class="info"><div class="name">管弦乐</div><div class="desc">宏大感人</div></div>
                    </div>
                    <div class="music-option" data-music="pop" onclick="selectMusic(this)">
                        <span class="icon">🎤</span>
                        <div class="info"><div class="name">流行歌曲</div><div class="desc">朗朗上口</div></div>
                    </div>
                </div>
            </div>
            <button class="generate-btn" id="generateBtn" onclick="generateVideo()">
                <span>💕</span><span>生成情感视频</span><span style="font-size: 14px; opacity: 0.8;">（消耗 15 积分）</span>
            </button>
        </section>
        <section class="result-section">
            <div class="result-placeholder" id="resultPlaceholder">
                <span class="icon">💕</span>
                <h3>情感类视频一键生产</h3>
                <p>选择情感主题并描述故事，AI将为您生成触动人心的情感短视频</p>
            </div>
            <div class="video-preview-container" id="resultContainer" style="display: none;">
                <div class="video-preview-header">
                    <span style="font-weight: 600;">💕 生成结果</span>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="downloadVideo()" style="padding: 8px 16px; background: rgba(233, 30, 99, 0.1); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); cursor: pointer;">⬇️ 下载</button>
                        <button onclick="regenerate()" style="padding: 8px 16px; background: rgba(233, 30, 99, 0.1); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); cursor: pointer;">🔄 重新生成</button>
                    </div>
                </div>
                <div class="video-preview-content">
                    <video class="video-player" id="resultVideo" controls>
                        <source src="" type="video/mp4">
                    </video>
                </div>
            </div>
        </section>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script>
        const CONFIG = { COST: 15, MODEL: 'banana2' };
        let state = { emotion: 'love', outline: '', quote: '', music: 'piano' };
        function selectEmotion(el) {
            document.querySelectorAll('.emotion-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            state.emotion = el.dataset.emotion;
        }
        function selectMusic(el) {
            document.querySelectorAll('.music-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            state.music = el.dataset.music;
        }
        document.getElementById('storyOutline').addEventListener('input', (e) => {
            document.getElementById('charCount').textContent = e.target.value.length;
        });
        async function generateVideo() {
            const credits = parseInt(document.getElementById('creditAmount').textContent.replace(/,/g, ''));
            if (credits < CONFIG.COST) {
                showToast('积分不足', 'error');
                return;
            }
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('generateBtn').textContent = '生成中...';
            await new Promise(r => setTimeout(r, 4000));
            document.getElementById('resultPlaceholder').style.display = 'none';
            document.getElementById('resultContainer').style.display = 'block';
            document.getElementById('creditAmount').textContent = (credits - CONFIG.COST).toLocaleString();
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').innerHTML = '<span>💕</span><span>生成情感视频</span><span style="font-size: 14px; opacity: 0.8;">（消耗 15 积分）</span>';
            showToast('💕 情感视频生成功能开发中，API对接后可正常使用', 'warning');
        }
        function downloadVideo() { showToast('下载功能开发中', 'warning'); }
        function regenerate() { generateVideo(); }
        function goBack() { window.location.href = 'ai-workbench-20260415_162800.html'; }
        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${msg}</span>`;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }
    </script>
</body>
</html>
