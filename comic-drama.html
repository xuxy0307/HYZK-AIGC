<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫剧一键生产 - 华阳智瞰</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #9c27b0; --primary-dark: #7b1fa2; --secondary: #ce93d8;
            --bg-dark: #0f172a; --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.2); --success: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg-dark); min-height: 100vh; color: var(--text-primary);
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 20% 50%, rgba(156, 39, 176, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(206, 147, 216, 0.1) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
        }
        @keyframes bgPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .header {
            background: var(--bg-card); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .back-btn {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: rgba(156, 39, 176, 0.1); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text-primary); cursor: pointer;
        }
        .back-btn:hover { background: rgba(156, 39, 176, 0.2); border-color: var(--primary); }
        .header-title {
            font-size: 24px; font-weight: bold;
            background: linear-gradient(135deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .credit-display {
            display: flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.2), rgba(206, 147, 216, 0.2));
            border: 1px solid rgba(156, 39, 176, 0.3); border-radius: 12px; font-weight: 600;
        }
        .main-container {
            max-width: 1400px; margin: 0 auto; padding: 40px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        }
        .input-section { display: flex; flex-direction: column; gap: 24px; }
        .section-card {
            background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px; padding: 28px;
        }
        .section-title {
            font-size: 18px; font-weight: 600; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title .icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
        }
        .input-mode-tabs {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .mode-tab {
            flex: 1; padding: 14px; background: rgba(15, 23, 42, 0.4);
            border: 2px solid var(--border); border-radius: 12px;
            cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .mode-tab:hover { border-color: var(--primary); }
        .mode-tab.selected { border-color: var(--primary); background: rgba(156, 39, 176, 0.2); }
        .mode-tab .emoji { font-size: 28px; margin-bottom: 8px; }
        .mode-tab .name { font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; }
        .form-textarea {
            width: 100%; padding: 14px 18px; background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 15px; min-height: 150px; resize: vertical;
        }
        .form-textarea:focus { outline: none; border-color: var(--primary); }
        .upload-area {
            border: 2px dashed var(--border); border-radius: 16px; padding: 40px;
            text-align: center; cursor: pointer; transition: all 0.3s; position: relative;
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(156, 39, 176, 0.05); }
        .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-placeholder { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text-secondary); }
        .upload-placeholder .icon { font-size: 48px; opacity: 0.6; }
        .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .style-option {
            padding: 16px; background: rgba(15, 23, 42, 0.4);
            border: 2px solid var(--border); border-radius: 12px;
            cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .style-option:hover { border-color: var(--primary); }
        .style-option.selected { border-color: var(--primary); background: rgba(156, 39, 176, 0.2); }
        .style-option .emoji { font-size: 32px; margin-bottom: 8px; }
        .style-option .name { font-weight: 600; font-size: 13px; }
        .duration-slider {
            width: 100%; margin: 20px 0;
        }
        .slider-labels {
            display: flex; justify-content: space-between; color: var(--text-secondary); font-size: 13px;
        }
        input[type="range"] {
            width: 100%; height: 8px; background: rgba(148, 163, 184, 0.2);
            border-radius: 4px; outline: none; -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%; cursor: pointer;
        }
        .generate-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 14px;
            font-size: 18px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .generate-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(156, 39, 176, 0.4); }
        .result-section { display: flex; flex-direction: column; gap: 24px; }
        .result-placeholder {
            flex: 1; min-height: 500px; background: var(--bg-card);
            border: 2px dashed var(--border); border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; color: var(--text-secondary); text-align: center; padding: 40px;
        }
        .result-placeholder .icon { font-size: 80px; opacity: 0.4; }
        .result-display {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; overflow: hidden;
        }
        .result-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .result-title { font-size: 16px; font-weight: 600; }
        .result-actions { display: flex; gap: 10px; }
        .result-action-btn {
            padding: 8px 16px; background: rgba(156, 39, 176, 0.1);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-primary); font-size: 13px; cursor: pointer;
        }
        .result-action-btn:hover { background: rgba(156, 39, 176, 0.2); border-color: var(--primary); }
        .video-container {
            padding: 24px; background: rgba(0, 0, 0, 0.3);
            display: flex; justify-content: center;
        }
        .video-player {
            width: 100%; max-width: 400px; border-radius: 12px; background: #000;
        }
        .episodes-list {
            padding: 20px 24px; border-top: 1px solid var(--border);
        }
        .episodes-title { font-weight: 600; margin-bottom: 12px; }
        .episode-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; background: rgba(15, 23, 42, 0.4);
            border-radius: 10px; margin-bottom: 8px; cursor: pointer;
        }
        .episode-item:hover { background: rgba(156, 39, 176, 0.1); }
        .episode-thumb {
            width: 80px; height: 60px; background: rgba(0, 0, 0, 0.3);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }
        .episode-info { flex: 1; }
        .episode-name { font-weight: 500; margin-bottom: 4px; }
        .episode-duration { font-size: 12px; color: var(--text-secondary); }
        .toast-container {
            position: fixed; top: 100px; right: 30px; z-index: 10000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            padding: 14px 24px; background: var(--bg-card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; padding: 20px; }
            .style-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">
                <span>←</span><span>返回工作台</span>
            </button>
            <h1 class="header-title">🎭 漫剧一键生产</h1>
        </div>
        <div class="header-right">
            <div class="credit-display">
                <span>💎</span><span id="creditAmount">2,580</span>
            </div>
        </div>
    </header>
    <main class="main-container">
        <section class="input-section">
            <div class="section-card">
                <div class="section-title">
                    <div class="icon">📖</div><span>输入方式</span>
                </div>
                <div class="input-mode-tabs">
                    <div class="mode-tab selected" data-mode="text" onclick="selectMode(this)">
                        <div class="emoji">📝</div><div class="name">文本输入</div>
                    </div>
                    <div class="mode-tab" data-mode="novel" onclick="selectMode(this)">
                        <div class="emoji">📚</div><div class="name">小说链接</div>
                    </div>
                    <div class="mode-tab" data-mode="script" onclick="selectMode(this)">
                        <div class="emoji">📄</div><div class="name">剧本上传</div>
                    </div>
                </div>
                <div id="textInputSection">
                    <div class="form-group">
                        <label class="form-label">故事梗概/剧本内容</label>
                        <textarea class="form-textarea" id="storyContent" placeholder="输入你的故事内容，可以是小说片段、剧本、或者故事梗概..."></textarea>
                    </div>
                </div>
                <div id="fileInputSection" style="display: none;">
                    <div class="upload-area" onclick="document.getElementById('scriptFile').click()">
                        <input type="file" id="scriptFile" accept=".txt,.doc,.docx,.pdf" onchange="handleFileUpload(event)">
                        <div class="upload-placeholder">
                            <span class="icon">📄</span>
                            <p>点击上传剧本文件</p>
                            <p style="font-size: 13px; opacity: 0.7;">支持 TXT、DOC、DOCX、PDF 格式</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-title">
                    <div class="icon">🎨</div><span>漫画风格</span>
                </div>
                <div class="style-grid">
                    <div class="style-option selected" data-style="anime" onclick="selectStyle(this)">
                        <div class="emoji">🇯🇵</div><div class="name">日式动漫</div>
                    </div>
                    <div class="style-option" data-style="manhua" onclick="selectStyle(this)">
                        <div class="emoji">🇨🇳</div><div class="name">国漫风格</div>
                    </div>
                    <div class="style-option" data-style="webtoon" onclick="selectStyle(this)">
                        <div class="emoji">🇰🇷</div><div class="name">韩漫条漫</div>
                    </div>
                    <div class="style-option" data-style="realistic" onclick="selectStyle(this)">
                        <div class="emoji">🎬</div><div class="name">写实风格</div>
                    </div>
                    <div class="style-option" data-style="chibi" onclick="selectStyle(this)">
                        <div class="emoji">🧸</div><div class="name">Q版萌系</div>
                    </div>
                    <div class="style-option" data-style="ink" onclick="selectStyle(this)">
                        <div class="emoji">🖌️</div><div class="name">水墨画风</div>
                    </div>
                </div>
            </div>
            <div class="section-card">
                <div class="section-title">
                    <div class="icon">⏱️</div><span>视频时长</span>
                </div>
                <div class="duration-slider">
                    <input type="range" id="durationSlider" min="1" max="10" value="3" onchange="updateDuration(this.value)">
                    <div class="slider-labels">
                        <span>1分钟</span>
                        <span id="durationValue">3分钟</span>
                        <span>10分钟</span>
                    </div>
                </div>
            </div>
            <button class="generate-btn" id="generateBtn" onclick="generateComicDrama()">
                <span>🎭</span><span>生成漫剧</span><span style="font-size: 14px; opacity: 0.8;">（消耗 25 积分）</span>
            </button>
        </section>
        <section class="result-section">
            <div class="result-placeholder" id="resultPlaceholder">
                <span class="icon">🎭</span>
                <h3>漫剧一键生产</h3>
                <p>输入故事内容并选择风格，AI将为您生成完整的漫剧视频</p>
            </div>
            <div class="result-display" id="resultDisplay" style="display: none;">
                <div class="result-header">
                    <span class="result-title">🎭 漫剧生成结果</span>
                    <div class="result-actions">
                        <button class="result-action-btn" onclick="downloadVideo()">⬇️ 下载</button>
                        <button class="result-action-btn" onclick="regenerate()">🔄 重新生成</button>
                    </div>
                </div>
                <div class="video-container">
                    <video class="video-player" id="resultVideo" controls>
                        <source src="" type="video/mp4">
                    </video>
                </div>
                <div class="episodes-list">
                    <div class="episodes-title">📋 剧集列表</div>
                    <div class="episode-item">
                        <div class="episode-thumb">🎬</div>
                        <div class="episode-info">
                            <div class="episode-name">第1集：开篇</div>
                            <div class="episode-duration">3:00</div>
                        </div>
                    </div>
                    <div class="episode-item">
                        <div class="episode-thumb">🎬</div>
                        <div class="episode-info">
                            <div class="episode-name">第2集：发展</div>
                            <div class="episode-duration">3:00</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script>
        const CONFIG = { COST: 25, MODEL: 'banana2' };
        let state = { mode: 'text', content: '', style: 'anime', duration: 3, file: null };
        function selectMode(el) {
            document.querySelectorAll('.mode-tab').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            state.mode = el.dataset.mode;
            document.getElementById('textInputSection').style.display = state.mode === 'text' ? 'block' : 'none';
            document.getElementById('fileInputSection').style.display = state.mode === 'script' ? 'block' : 'none';
        }
        function selectStyle(el) {
            document.querySelectorAll('.style-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            state.style = el.dataset.style;
        }
        function updateDuration(val) {
            state.duration = val;
            document.getElementById('durationValue').textContent = val + '分钟';
        }
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                state.file = file;
                showToast('文件上传成功: ' + file.name, 'success');
            }
        }
        async function generateComicDrama() {
            const credits = parseInt(document.getElementById('creditAmount').textContent.replace(/,/g, ''));
            if (credits < CONFIG.COST) {
                showToast('积分不足', 'error');
                return;
            }
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('generateBtn').textContent = '生成中...';
            await new Promise(r => setTimeout(r, 5000));
            document.getElementById('resultPlaceholder').style.display = 'none';
            document.getElementById('resultDisplay').style.display = 'block';
            document.getElementById('creditAmount').textContent = (credits - CONFIG.COST).toLocaleString();
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').innerHTML = '<span>🎭</span><span>生成漫剧</span><span style="font-size: 14px; opacity: 0.8;">（消耗 25 积分）</span>';
            showToast('🎭 漫剧生成功能开发中，API对接后可正常使用', 'warning');
        }
        function downloadVideo() { showToast('下载功能开发中', 'warning'); }
        function regenerate() { generateComicDrama(); }
        function goBack() { window.location.href = 'ai-workbench-20260415_162800.html'; }
        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${msg}</span>`;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }
    </script>
</body>
</html>
